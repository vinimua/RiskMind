[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "risk-platform"
version = "0.1.0"
description = "Credit risk model monitoring and governed iteration platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "langgraph",
  "langchain-openai>=1.7,<2",
  "openai",
  "uvicorn[standard]",
  "pydantic-settings",
  "PyYAML>=6,<7",
  "tokenizers==0.22.2",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]
database = ["sqlalchemy", "alembic", "psycopg[binary]"]
worker = ["celery[redis]"]
modelops = ["mlflow"]
observability = ["langfuse>=4,<5"]
knowledge = ["pymilvus==2.6.17"]
recovery = ["langgraph-checkpoint-postgres>=2.0.25,<4", "psycopg[binary]"]
mcp = ["mcp==2.3.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"risk_platform.core" = ["deepseek_v4_tokenizer.json"]
"risk_platform.api" = ["action_review.html"]
"risk_platform.agents" = ["skill_library/*/SKILL.md", "skill_library/*/references/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
